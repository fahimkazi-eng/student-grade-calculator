<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background: #f2f4f7;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Grade Calculator</h1>

        <label>Subject 1</label>
        <input type="number" id="subject1" min="0" max="100">

        <label>Subject 2</label>
        <input type="number" id="subject2" min="0" max="100">

        <label>Subject 3</label>
        <input type="number" id="subject3" min="0" max="100">

        <button onclick="calculateGrade()">Calculate Grade</button>

        <div id="result">
            Enter your marks and click the button.
        </div>

    </div>

    <script>
        function calculateGrade() {

            let mark1 = Number(document.getElementById("subject1").value);
            let mark2 = Number(document.getElementById("subject2").value);
            let mark3 = Number(document.getElementById("subject3").value);

            if (
                mark1 < 0 || mark1 > 100 ||
                mark2 < 0 || mark2 > 100 ||
                mark3 < 0 || mark3 > 100
            ) {
                document.getElementById("result").innerHTML =
                    "Please enter marks between 0 and 100.";
                return;
            }

            let total = mark1 + mark2 + mark3;
            let average = total / 3;

            let grade;

            if (average >= 80) {
                grade = "A+";
            } else if (average >= 70) {
                grade = "A";
            } else if (average >= 60) {
                grade = "B";
            } else if (average >= 50) {
                grade = "C";
            } else if (average >= 40) {
                grade = "D";
            } else {
                grade = "F";
            }

            document.getElementById("result").innerHTML =
                "<strong>Total:</strong> " + total +
                "<br><strong>Average:</strong> " + average.toFixed(2) +
                "<br><strong>Grade:</strong> " + grade;
        }
    </script>

</body>
</html>
